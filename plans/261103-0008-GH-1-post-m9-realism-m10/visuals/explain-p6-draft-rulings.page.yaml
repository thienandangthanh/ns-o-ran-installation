          - { text: "Reword the TB reason to \"count per cell on transmission; the follow-up chooses the site\"", done: false }
          - { text: "eNB RRC.ConnMean → holds:false (attach bound unproven), renamed in place (follows from R1)", done: false }
          - { text: "Registry doc line 10: label the timing allowance as the project's tolerance and add the boundary rule", done: false }
          - { text: "Correct the false \"No 32.425 entry\" reasons (32.425 has them at §4.4.1.1 p.48, §4.4.3.1 p.52, §4.4.7.1 p.58; the renames stand on type, unit and label)", done: false }
          - { text: "Fix the 2246 note: pendingFix \"P9\" is a contract deviation id, not a plan-phase id; the 21:37 line is a ruling", done: false }
          - { text: "Replace \"ledger row 147 (n)\" and \"user ruling Q2\" labels in code and registry text with the rule they state", done: false }
          - { text: "gnb ue 29 layer → RLC (it is counted in the same RLC loop as ue 28)", done: false }
          - { text: "Disclose in the P6 amendment: ad-cell loses RRC.ConnMean, PRB and throughput fields; the vendor-name rule is stricter than row 147 (6)", done: false }
          - { text: "P9 registry entries: record rounding to Kbit as an interpretation", done: false }
          - { text: "Re-cite ns-3 line numbers at the UB-fix pin (certain: the UB fix lands before P6)", done: false }

