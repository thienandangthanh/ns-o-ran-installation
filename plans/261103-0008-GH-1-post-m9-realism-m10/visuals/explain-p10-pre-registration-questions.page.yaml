version: 1
meta:
  title: P10 questions explained
  description: The five rulings P10 waits for before its next commit, in plain words, with a post-office analogy, the default and the alternative for each, and what kongming and Codex each recommend after cross-checking each other.
theme:
  preset: editorial
blocks:
  - type: hero
    eyebrow: M10 · P10 · every pre-registration question ruled
    title: What the P10 questions are asking you
    description: "P10 fixes how the simulator counts and labels data, so the numbers the RIC sees mean what the 3GPP rulebook says they mean. Reading the rulebook closely turned up five places where the plan's own wording cannot be followed as written. Each needs your choice before the code that depends on it."

  - type: section
    title: The gist
    blocks:
      - type: rich-text
        text: |
          The plan said "fix P6, P7 and P9 to match the spec". A researcher then read 3GPP TS 28.552, 38.323 and 37.340 line by line, and kongming checked that reading against the PDFs in Zotero. Both found that for two items (P6 and P9) the spec gives an answer the plan did not expect, and for one (P7) the spec allows two choices. The other two questions are about an ns-3 bug (UB) and a missing spec (Q3).

          Nothing here is urgent in hours, but each question blocks a specific commit. The table below says which. Kongming and Codex were each asked separately, then kongming checked Codex's answer against the code. After that cross-check they agree on all five; kongming changed its advice on Q3 and Q4.
      - type: callout
        tone: success
        title: "Your rulings (2026-11-06 18:59, 19:52, 20:46 and 21:37 KST)"
        text: "UB: fix it (contract Amendment 4, its own ns-3 commit before P6). Q1: rename the failing names to ns3.* vendor names. Q2: Option A, the X2 counters (this includes the T3 change of r3p-scenario.json). Q3: done, you added 3GPP TS 32.425 V19.0.0 (and later 28.552 V17.17.0) to Zotero. Q4: 12-bit SN, with the wrap fix in its own commit before P7. Lint version: 28.552 V20.2.0 only, with the successor rule. PRB source fix: a follow-up outside M10. L2: the lint flags sub-counter suffixes, no label support in M10. L4: per-UE rows are checked against KPM §7.9. L5: kept 3GPP names use the 3GPP data type. Nothing is open now; the next step is registering the ledger rows before code, after the M7 diagnosis."
      - type: callout
        tone: warning
        title: Separate problem, not one of the five questions
        text: "The D-R3-1 gate chain (the NR-ARFCN fix) finished red at M7. M2–M6 passed, including the codec-byte check. M7 failed its four pod-recovery checks (restart, new E2 Setup, new subscription, first indication after the pod delete). The cause is not known yet: it may be the D-R3-1 change or a flaky recovery phase. It needs a diagnosis and a kongming consult before any fix. Evidence: evidence/m7/20261105T211444Z."
      - type: key-value
        title: Where things stand
        items:
          - { key: P09, value: "Done 2026-11-06. The 10-gNB scale gate passed (11 agents, 2,338 ticks)." }
          - { key: D-R3-1, value: "Code committed (Testbed 163ef25, harness a7943bf). Its gate chain is red at M7, cause unknown." }
          - { key: /goal, value: "Cleared by you at 07:26 KST. Nothing runs until you say so." }
          - { key: Sources, value: "researcher-261106-0500 (draft), kongming-261106-0500 (verification), decisions-261106-0525 (question list), all in plans/reports/." }

  - type: section
    title: "The analogy: a parcel service with two post offices"
    blocks:
      - type: rich-text
        text: |
          Picture a parcel service delivering to one house. There is a main post office and a smaller express depot. Every parcel goes to the main office first. A clerk there stamps it with a serial number and a label, then sends it to the house either by the main office's own truck or, through a courier road, by the express depot's fast van. Each office keeps a logbook with columns whose names come from a national rulebook. Head office reads those logbooks to decide which office should serve which house.

          The rulebook is strict about what each column means. Questions P6 and P9 are about our express depot writing numbers into columns that, by the rulebook, belong to somebody else.
      - type: table
        title: How the analogy maps to the system
        columns: [ In the analogy, In the system, Why it fits ]
        rows:
          - [ The main post office, "The LTE eNB, the master node (MN)", "Every parcel enters here first, and only this office stamps them." ]
          - [ The express depot, "The NR en-gNB, the secondary node (SN)", "It carries part of the traffic over the faster 5G radio, but stamps nothing." ]
          - [ Stamping a parcel with a number and label, "PDCP (Packet Data Convergence Protocol): numbers each packet and adds a header", "Done once, at the MN, for the split bearer." ]
          - [ The courier road between the offices, "X2-U, the user-plane link between eNB and en-gNB", "Stamped packets travel over it to the en-gNB." ]
          - [ The van loading the parcels, "RLC and MAC, the en-gNB's lower radio layers", "The en-gNB only queues and transmits." ]
          - [ The logbook columns, "KPM measurements (e.g. DRB.PdcpSduVolumeDL)", "Their names and meanings come from 3GPP TS 28.552." ]
          - [ Head office reading logbooks, "kpimon and the TS xApp in the near-RT RIC", "They read the counters and decide handovers." ]
      - type: callout
        tone: info
        title: Where the analogy stops
        text: "A real parcel is one object. A packet can be split across both paths and retransmitted, so one stamped parcel can be loaded twice by the van (a retransmission). Also, the logbook is sent every 100 ms, not once a day, and the rulebook is two documents: 28.552 for 5G offices and 32.425 for LTE offices."
      - type: diagram-panel
        title: Where data is numbered and where it is counted
        caption: "Downlink data enters at the eNB, gets its PDCP number there, then leaves by the LTE radio or by X2 to the en-gNB. kpimon reads the counters from each node's E2 agent."
        spec:
          schema_version: 1
          diagram_type: architecture
          meta:
            title: EN-DC split bearer in the testbed
            description: "Core network to eNB with PDCP, then either the LTE radio or X2 to the en-gNB RLC and MAC, then to the UE. kpimon reads KPM counters from both nodes."
            visual_preset: editorial
            theme: light
          components:
            - { id: core, label: "Core network (EPC)", role: external, layer: 0 }
            - { id: enb, label: "LTE eNB (MN): PDCP numbers each packet", role: backend, layer: 1 }
            - { id: gnb, label: "NR en-gNB (SN): RLC + MAC only", role: worker, layer: 2 }
            - { id: ue, label: "Phone (UE)", role: frontend, layer: 3 }
            - { id: kpimon, label: "kpimon in the RIC", role: database, layer: 3 }
          connections:
            - { from: core, to: enb, label: "IP packets", kind: stream }
            - { from: enb, to: gnb, label: "X2-U: stamped packets", kind: stream }
            - { from: enb, to: ue, label: "LTE radio leg", kind: stream }
            - { from: gnb, to: ue, label: "NR radio leg", kind: stream }
            - { from: gnb, to: kpimon, label: "KPM counters over E2", kind: async }
            - { from: enb, to: kpimon, label: "KPM counters over E2", kind: async }

  - type: section
    title: All five questions at a glance
    blocks:
      - type: table
        columns: [ "#", Topic, What it asks, Recommended, Alternative, Blocks ]
        rows:
          - [ UB, ns-3 neighbour bug, "Fix a simulator bug that hides a UE's only neighbour cell, or only disclose it?", "RULED: fix it (contract Amendment 4)", "Disclose only", "P6, the next commit" ]
          - [ Q1, "P6: a mislabelled column", "The en-gNB writes its MAC volume under a name 28.552 reserves for split gNBs. Rename it?", "RULED: rename it, and every other failing name, to ns3.* vendor names", "Keep the 3GPP name and record a deviation", P6 code ]
          - [ Q2, "P9: the wrong office's count", "The en-gNB's PDCP volume should be 0 by the rulebook. Which counter carries what it actually sends?", "RULED: Option A, the X2 counters", "A′ (leaner rename) or B (keep the name)", "P9 code; decide now because it fixes the budget" ]
          - [ Q3, Missing LTE rulebook, "Read AC16's '28.552 clause' as 32.425 for LTE rows, and add 32.425 to Zotero?", "RULED: done, you added 32.425 V19.0.0; any LTE name it cannot verify is renamed to ns3.*", "Keep LTE names whose type and unit KPM lists, marked 'unverified' (both advisors now reject this)", P6 code ]
          - [ Q4, "P7: label serial-number size", "Should the new NR packet header use a 12-bit or an 18-bit sequence number?", "RULED: 12 bits, with the wrap-bug fix as its own commit just before P7", "18 bits (kongming's first advice, now reversed)", P7 code ]

  - type: section
    title: "UB: the ns-3 neighbour-list bug (recommended: fix under Amendment 4)"
    blocks:
      - type: rich-text
        text: |
          The question. ns-3 has a bug that sometimes drops a phone's only neighbour cell from the measurement report. Should M10 fix it, or only disclose it?

          In the analogy. Each depot's logbook has a line "other offices this house can also hear, strongest first". The clerk reads the list backwards and stops one step too early. When the list has exactly two offices, and the house's own office is the stronger one with the higher number, the clerk skips the only other office. The report then says "no other office in range", which is false.

          In the system. The loop is at `mmwave-enb-net-device.cc:1001-1003`. It counts down past `sortFlipMap.begin()`, which is undefined behaviour (UB): C++ does not say what happens. With the GNU library we use, it drops the only neighbour whenever a UE's map has 2 cells and the serving cell has the higher cell ID and is the strongest.
      - type: stats
        items:
          - { label: "r2 reports checked", value: "594" }
          - { label: "Reports that lost their only neighbour", value: "82" }
          - { label: "Node 2 (lower cell ID)", value: "0 of 416" }
          - { label: "Node 3 (higher cell ID)", value: "82 of 178" }
      - type: accordion
        title: Background
        items:
          - title: Why does it need a contract amendment?
            text: |
              The outcome contract lists exactly which simulator fixes M10 may make (the T-C list: P6, P7, P9, P15, UseIdealRrc). This bug is not on that list. Any change outside it is a scope change, which the contract says needs your approval as an amendment. That would be Amendment 4.
          - title: What does it affect?
            text: |
              Every two-gNB test (r0, r2, r3p) and so the stored references M9, checkpoint 1, checkpoint 2 and δ. Their recorded neighbour lists are missing entries. The 10-gNB s10 test cannot hit it, because its maps have 10 entries.
          - title: Why decide now and not at Stop B?
            text: |
              Checkpoint 3 (P11) records new references and tags them. Tags never move. If the fix comes after that, M10 ships with the bug in its references. So "decide at Stop B" means "never in M10".
      - type: comparison
        left:
          label: "Fix under Amendment 4 (recommended)"
          items:
            - "Its own ns-3 commit, right after D-R3-1 and before P6"
            - "A ledger row: every 2-cell tick reports exactly 1 neighbour; a 0-neighbour fixture fails"
            - "Cost: M4 and M5–M7, about 1 h and 3–4 GiB"
            - "Tests cover maps of 1, 2, 8, 9 and 10 cells and equal-strength ties, plus one 10-gNB s10 run"
            - "The checkpoint-3 diff then names this fix as the cause of the changed neighbour lists"
        right:
          label: Disclose only (default)
          items:
            - "No code change"
            - "Every 2-gNB reference keeps the missing-neighbour artefact"
            - "Listed as a known model defect in the M10 records"
            - "Cannot be fixed later inside M10"

  - type: section
    title: "Q1 / P6: a column with the wrong name (recommended: rename to ns3.*)"
    blocks:
      - type: rich-text
        text: |
          The question. The en-gNB reports its MAC-layer data volume under the name `QosFlow.PdcpPduVolumeDL`. Should that name, and every other name that fails a strict rulebook check, be renamed to a vendor name like `ns3.du.macVolumeDl`?

          In the analogy. The express depot writes "parcels loaded into the van, counting reloads" into a column the rulebook calls "parcels the stamping desk passed to the loading bay at a depot that has its own stamping desk, not counting two-office deliveries". Our depot has no stamping desk, and every delivery is a two-office delivery. There is no right column for its number in the rulebook at all.

          In the system. 3GPP TS 28.552 §5.1.3.6.1.1 (PDF pp.196–197) defines QosFlow.PdcpPduVolumeDL only for a split gNB (one with separate CU and DU parts). It explicitly excludes dual-connectivity volume. Our en-gNB is not split, and every bearer is EN-DC (dual connectivity). 28.552 has no MAC-layer volume measurement anywhere. The value is computed from MAC transport blocks, retransmissions included (`mmwave-phy-trace.cc:262`), and sent at `metric-map.v1.json:33`.
      - type: rich-text
        text: |
          Your follow-up: why were these names used in the first place, and can they come from specs other than 28.552?

          Short answer. This project did not invent most of them. 32 of the 38 non-ns3 names came with ns-O-RAN, written in 2022 by its authors (Michele Polese, Andrea Lacava, Tommaso Zugno). They appear in ns-3-mmwave-oran commit `fccf3903` (2022-04-15) as CSV column headers (`mmwave-enb-net-device.cc:432-458`, `lte-enb-net-device.cc:632-642`), and in the oran-interface module that sends them over E2 (its public history starts at `8585bec`, 2022-09-25, with the names already there). Our metric map inherited them. Most were copied from real specs of that time: 3GPP TS 28.552 Release 16/17 for the gNB, and 3GPP TS 32.425 for the LTE eNB. So yes, several come from other specs or older versions, and a few come from no spec at all. The project itself added only 6 names, all correct (`RRU.PrbAvailDl/Ul`, `RRU.PrbTotDl/Ul` in Testbed `d487283`, 2026-10-22; `DRB.PdcpSduVolumeUL/DL` in oran-interface `96efc40`, 2026-10-27).
      - type: table
        title: "Where the failing names come from (researcher, checked against 28.552 V16.6, V17.6, V17.17, V20.2, 32.425 V19.0 and KPM v03)"
        columns: [ Kind, Names, What happened ]
        rows:
          - [ "Real, but from an older 28.552", "RRU.PrbTotDl, RRU.PrbTotUl", "The 28.552 name in V16.6.0 (p.25), V17.6.0 (p.33) and V17.17.0 (p.34). V20.2.0 renames it RRU.PrbDl/Ul (pp.44-45). 32.425 §4.5.3 still uses RRU.PrbTotDl for LTE." ]
          - [ "Real, spelling fixed since", TB.ErrTotalNbrDl.1, "Rel-16/17 printed a typo, TB.ErrToltalNbrDl.X; ns-O-RAN corrected it its own way. V20.2.0 spells it TB.ErrTotNbrDl.X (§5.1.1.7.4, p.113)." ]
          - [ "Real, from 32.425 with other capitals", DRB.PdcpSduBitRateDl, "32.425 has DRB.PdcpSduBitrateDl.QCI (§4.4.1.1, p.48)." ]
          - [ "Real, wrong form", "CARR.PDSCHMCSDist.Bin1–6", "28.552 §5.1.1.12.1 (p.121) needs three bins in the name (rank, table, MCS: BinX.BinY.BinZ) and counts resource blocks; ns-3 counts transport blocks." ]
          - [ "Real, used on the wrong node or with the wrong value", "QosFlow.PdcpPduVolumeDL, DRB.EstabSucc.5QI, DRB.RelActNbr.5QI, DRB.PdcpSduVolumeDl, DRB.PdcpSduDelayDl", "Split-gNB name fed MAC/RLC values; 5G names on the LTE eNB (one fed a constant 0); an SDU name fed PDU bytes; a 32.425 name with its .QCI dropped." ]
          - [ "In no spec at all", "L1M.RS-SINR.Bin* (7), DRB.BufferSize.Qos, DRB.PdcpPduNbrDl.Qos, Tot.PdcpSduNbrDl", "ns-O-RAN inventions styled like 3GPP names. Nearest real ones: 32.425 §6.6 MR.RSSINR.BinX, 28.552 §5.1.1.32.1 MR.NRScSSSINR.BinX, KPM §7.10.8 L1M.DL-SS-SINR.SSB." ]
      - type: callout
        tone: info
        title: "Why ns-O-RAN could get away with it"
        text: "In 2021-22 ns-O-RAN sent its values in its own ASN.1 module (E2SM-KPM-RC, in oran-e2sim, by Lacava and Zugno), built on E2SM-KPM v1, which carried fixed container fields rather than named measurements. The 3GPP-style strings were mainly labels for the CSV logs and the dashboards, so nobody checked them against a spec. Our port sends them as real KPM measurement names, which is why AC16 now holds them to the spec. (The authors' intent is an inference; the commits are verified.)"
      - type: callout
        tone: warning
        title: "Two new small questions this answer raises"
        text: "1) Which 28.552 version should the strict lint judge against? Under V17, RRU.PrbTotDl/Ul and the TB error name are real NR names. Renaming them to ns3.* would throw away a real 3GPP name. Proposed default: judge against the newest version in Zotero (V20.2.0), and where an old name has a current successor with the same meaning (unit, object, counting point), rename to that 3GPP name (RRU.PrbDl/Ul, TB.ErrTotNbrDl) instead of ns3.*; otherwise ns3.*. 2) KPM v03.00 §8.3.9 (p.30) says sub-counters belong in Measurement Labels, not in the name, so '.5QI', '.Qos' and '.1' inside a name are themselves questionable. Proposed default: the lint flags them, and the rename rule moves them out of the name."
      - type: accordion
        title: Background
        items:
          - title: What is the metric map and the lint?
            text: |
              `ns3_e2_agent/schema/metric-map.v1.json` in the Testbed fork lists every value the E2 agent reports: its KPM name, unit, type and order. The lint (`lint-metric-map.py`) checks that file. Contract AC16 says the lint must match each name's source, unit and type to its 28.552 clause.
          - title: Why about 20 names, not 1?
            text: |
              Kongming checked the whole map against 28.552. About 20 of the 38 non-vendor names fail: some do not exist in 28.552 (DRB.BufferSize.Qos, DRB.PdcpPduNbrDl.Qos, L1M.RS-SINR.Bin*), some use a different form (CARR.PDSCHMCSDist.Bin1–6), some are 5G names on the LTE node, and RRU.PrbTot* must be checked for unit. A pre-registered rule renames each failing name in place to ns3.*, so you do not need to rule name by name.
          - title: Does a rename change the data the RIC sees?
            text: |
              The numbers do not change. The agent sends values by measurement ID, and a rename in place keeps the ID and order, so the indication bytes stay identical. What changes is the name list in E2 Setup, the Influx field names, and kpimon's measurement list. It costs one agent rebuild, one kpimon reinstall, and M5–M7.
      - type: comparison
        left:
          label: "Rename to ns3.* (recommended)"
          items:
            - "No node sends QosFlow.PdcpPduVolumeDL"
            - "About 30 map rows renamed, same order and measId"
            - "The lint is honest by construction; P6 ends fixed"
            - "No contract amendment; it departs from the plan's first Design option, so it is your ruling"
        right:
          label: "Keep the 3GPP name, record a deviation"
          items:
            - "No churn in names"
            - "P6 stays a known deviation"
            - "The lint must carry an exception for it"
            - "Kongming rejects it: the clause is split-only and excludes DC"

  - type: section
    title: "Q2 / P9: the depot counting the main office's stamps (recommended: Option A)"
    blocks:
      - type: rich-text
        text: |
          The question in one line. The en-gNB currently reports a number under a name that, by the rulebook, means something it never does. Which name should that number go under instead, and what should the old name say?

          In the analogy. The depot's logbook has a column "parcels stamped at this office". The depot stamps nothing, so honestly that column is 0. Today the depot copies the main office's whole stamp count into it, including the parcels the main office delivered with its own truck. The rulebook has a different column for what the depot really handles: "parcels passed between offices over the courier road".

          In the system. The name `DRB.PdcpSduVolumeDL` counts bits entering this node's own PDCP (3GPP TS 28.552 §5.1.2.1.1.1). The ns-3 en-gNB has no PDCP for these bearers; the eNB's `McEnbPdcp` numbers every packet. So by the rulebook the en-gNB's value is 0. What the en-gNB really carries is what reaches it over X2, and 28.552 has a name for exactly that: `DRB.PdcpSduVolumeX2DL` (§5.1.2.1.1.2). The R3′ predictor (the harness stand-in for QP) reads this counter to predict each cell's throughput.
      - type: accordion
        title: "Your follow-up questions (asked 2026-11-06 18:59)"
        items:
          - title: "\"Which counter carries what it actually sends?\" What does this mean?"
            text: |
              "Counter" here means a measurement name in the KPM report, that is, a column in the logbook. The question was: once `DRB.PdcpSduVolumeDL` honestly says 0 at the en-gNB, under which name should the en-gNB report the data that really flows through it?

              The data that really flows through the en-gNB is the share of the UE's packets that the eNB chose to send over X2 to the en-gNB, which the en-gNB then transmits on the NR radio. 28.552 defines a measurement for exactly that: `DRB.PdcpSduVolumeX2DL`, "the Data Volume (amount of PDCP SDU bits) in the downlink delivered on X2 interface in DC-scenarios" (§5.1.2.1.1.2, PDF p.183–184). Option A puts the number there. A better wording of the question would have been: "Which measurement name should hold the volume the en-gNB really carries?"
          - title: Where is DRB.PdcpSduVolumeDL defined?
            text: |
              In 3GPP TS 28.552 V20.2.0 (Zotero 5SZUBP6M), §5.1.2.1.1.1 "DL Cell PDCP SDU Data Volume", PDF p.183. It sits in §5.1.2, "Performance measurements valid only for non-split gNB deployment scenario", and its object is NRCellCU. The definition says (c): "This measurement is obtained by counting the number of bits entering the NG-RAN PDCP layers. The measurement is performed at the PDCP SDU level." The unit is Mbit; O-RAN E2SM-KPM v03.00 §7.9.1 changes it to kbit INTEGER for the KPM report.

              The LTE twin is `DRB.PdcpSduVolumeDl` (lower-case "l") in 3GPP TS 32.425 V19.0.0 (the copy you added, Zotero 9XR9PVRW), §4.4.7.1 "DL cell PDCP SDU Data Volume": "obtained by counting the number of bits entering the eNodeB/RN", at PDCP SDU level, object EUtranCellFDD/TDD.

              The next clause, §5.1.2.1.1.2, defines `DRB.PdcpSduVolumeX2DL`. Annex A.25 (PDF p.403) explains why it exists: "in scenarios of dual connectivity, for split bearers, PDCP data is transferred between the MN and the SN … the data volume transferred between MN and SN should be counted."
          - title: Why is it 0 at the en-gNB? (step by step)
            text: |
              Follow one downlink packet for a UE on the EN-DC split bearer.

              1. The packet arrives from the core network at the LTE eNB (the master node).
              2. The eNB's PDCP (`McEnbPdcp`) takes it as an SDU, numbers it, adds the PDCP header, and makes it a PDU. This is the only PDCP the packet ever enters. The bits "entering the PDCP layer" are counted here, at the eNB. That is 32.425's `DRB.PdcpSduVolumeDl` on the eNB.
              3. The eNB then picks a leg for this packet, about half to each (`perPckToLTE` 0.5). LTE leg: the eNB's own LTE RLC sends it (`mc-enb-pdcp.cc:221`). NR leg: the eNB sends the finished PDU over X2 to the en-gNB (`mc-enb-pdcp.cc:238`).
              4. On the NR leg the en-gNB puts the PDU straight into its RLC and MAC and sends it on the NR radio. It never passes the packet through a PDCP of its own, because the en-gNB has none for this bearer.

              28.552's `DRB.PdcpSduVolumeDL` at the en-gNB counts "bits entering the NG-RAN PDCP layers" of that node. In step 4 no bits enter a PDCP at the en-gNB, so the honest value is 0.
          - title: So what does the en-gNB report today?
            text: |
              Today's code (`mmwave-enb-net-device.cc:672-708`) adds up, for every UE the en-gNB knows, the eNB PDCP's transmit counter for that UE. That counter ticks for both legs: the same trace `m_txPdu` fires at `mc-enb-pdcp.cc:221` (LTE leg) and `:238` (X2 leg). So the en-gNB credits itself with the UE's whole PDCP volume, including the half the eNB delivered over its own LTE radio, which never touched the en-gNB. A code comment there already says so: "this is the MN-hosted volume credited to this cell".

              Two side effects: a UE listed by two en-gNBs during a cell change is credited to both, and the eNB's own LTE volume is counted a second time at the en-gNB.
          - title: "Your follow-up (19:35): what does DRB.PdcpSduVolumeX2DL count when the MN has n SNs? Only what went to one SN, or n times?"
            text: |
              Only what actually crossed X2 into that SN's cell. Nothing is multiplied by n.

              Who reports it. The measurement's object is NRCellCU (28.552 §5.1.2.1.1.2 f), so each en-gNB reports it for its own cell. Its definition (c) is "the number of bits transferred in the downlink through X2 interface", counted at PDCP SDU level. An en-gNB can only see the X2 traffic that arrives at it, so each SN's value is its own share.

              Why the shares add up instead of multiplying. In EN-DC "a UE is connected to one eNB that acts as a MN and one en-gNB that acts as a SN" (37.340 V19.3.0 §4.1.2, PDF p.12). One eNB can serve many UEs, each with its own SN, so the eNB may talk to n en-gNBs at once. But each packet of a UE goes over X2 once, to that UE's one SN. So if the eNB sends 1,000 packets to SN 1 and 600 to SN 2, SN 1 reports 1,000 and SN 2 reports 600. The sum over all SNs, 1,600, equals what the eNB sent over X2 in total. In ns-3 this holds too: the eNB sends each X2 packet to exactly one `targetCellId` (`mc-enb-pdcp.cc:232-238`), and Option A credits it to that cell only.

              The one place it can double. During an SN change, the old SN forwards its unsent packets to the new SN over X2-U (`lte-enb-rrc.cc:1160-1219`). Those packets cross X2 twice: MN to old SN, then old SN to new SN. Read literally, "transferred through X2" could count them at both SNs, so the network-wide sum would exceed the eNB's total by the forwarded amount (only the packets in flight at that moment, not n times). The pre-registered definition counts only MN-to-SN sends and excludes SN-to-SN forwarding, and the records disclose that choice. The per-cell volume check then compares each cell's value against exactly the packets the eNB sent to that cell.
      - type: table
        title: "One illustrative second for one UE (2,000 packets, about half on each leg)"
        columns: [ Where, Measurement, Defined in, Today, Option A ]
        rows:
          - [ LTE eNB, DRB.PdcpSduVolumeDl, "32.425 §4.4.7.1", "2,000 packets' bits", "2,000 packets' bits (unchanged; P9 does not touch the eNB)" ]
          - [ en-gNB, DRB.PdcpSduVolumeDL, "28.552 §5.1.2.1.1.1", "2,000 packets' bits (wrong: includes the LTE half)", "0 (no PDCP here)" ]
          - [ en-gNB, DRB.PdcpSduVolumeX2DL, "28.552 §5.1.2.1.1.2", not reported, "about 1,000 packets' bits (what the en-gNB really carries)" ]
      - type: callout
        tone: info
        title: About these numbers
        text: "The 50/50 split is random per packet, so the real split varies by a percent or two. The eNB row (32.425) is already where the full volume belongs; P9 changes only the en-gNB's two rows. The packet rate (one 1,308-byte packet every 500 µs per UE) is from scenario-zero.cc:691-693."
      - type: accordion
        title: Background
        items:
          - title: What is "T3" and why is r3p-scenario.json special?
            text: |
              `scripts/gates/r3p-scenario.json` holds the predictor's counter name and formula. The ledger's rule #9 marks it as a protected file: changing it can turn a red test green, so it needs your explicit approval (a T3 ruling). Option A changes its counter field (:8-10), formula (:13), transform (:29) and clause citation (:2).
          - title: What does the contract's open point 2 say?
            text: |
              "P9: the predictor reads the corrected counter, which may move R3′'s outcome." Kongming reads "the corrected counter" as whichever measurement honestly carries the en-gNB's routed volume, which under Option A is the X2 counter. If you read it as naming DRB.PdcpSduVolumeDL itself, Option A needs a contract amendment.
          - title: Will R3′ still pass?
            text: |
              Probably. Kongming expects per-cell values to roughly halve (about half the traffic goes by LTE, perPckToLTE 0.5), but the cell ratios that drive the decision (about 2:1 or 1:1) stay outside the 1.05–1.15 margin band. This is an estimate, not a measurement.
      - type: table
        title: The three options
        columns: [ Option, What changes, P9 ends, Cost ]
        rows:
          - [ "A (recommended)", "DRB.PdcpSduVolumeDL/UL = 0 at every en-gNB; new rows DRB.PdcpSduVolumeX2DL/UL carry the forwarded volume; the predictor reads X2DL with the same formula", Fixed, "T3 ruling; a second agent rebuild and kpimon reinstall; the r3p reference moves to the new key" ]
          - [ "A′", "Rename rows :56-57 in place to the X2 names; no DRB.PdcpSduVolumeDL on the en-gNB at all", Fixed, "Same T3; leaner; loses the explicit 'own PDCP is 0' evidence" ]
          - [ B, "Keep the name with the forwarded value, plus a recorded interpretation", "Not fixed (kongming)", "Cheapest, but a contract Decision because it still credits MN-stamped data to the en-gNB" ]
      - type: callout
        tone: warning
        title: Hidden cost found by kongming
        text: "The PDCP volume check (V3) runs today only inside the N4 gate, whose other half must equal a reference taken before P7. After P7 changes every packet size, that cannot hold, so V3 needs its own route before P9. This is registered without asking you, but it adds a run."

  - type: section
    title: "Q3: the missing LTE rulebook (recommended: use 32.425, please add it to Zotero)"
    blocks:
      - type: rich-text
        text: |
          The question. AC16 says each name is checked against "its 28.552 clause". 28.552 covers 5G (NR) nodes only. LTE eNB measurements are defined in 3GPP TS 32.425. May we read AC16 as "the node's own rulebook: 28.552 for NR, 32.425 for LTE"? And can you add 32.425 to Zotero?

          In the analogy. The main post office follows a different national rulebook from the express depot. We only have the depot's rulebook on the shelf.

          Why it matters. Without 32.425 we cannot check the eNB's names. Kongming first proposed a soft fallback: keep eNB names whose type and unit KPM §7.9.1 lists, marked "unverified against Zotero" (AC20). Codex showed that is too loose, and kongming agreed: a matching name and unit do not prove the value means the right thing. Row `:128` is the proof: its name and unit match, but it counts PDCP PDU bytes where the name means SDU bytes (`lte-enb-net-device.cc:1110-1111`). So without 32.425, every eNB name that cannot be checked is renamed to ns3.*, unless you grant a named exception.
      - type: comparison
        left:
          label: "Read as 32.425 + add it (recommended)"
          items:
            - "A few minutes of your time"
            - "eNB rows verified against their real rulebook"
            - "KPM §7.4.2.2 (p.9) already names both specs"
        right:
          label: "No 32.425"
          items:
            - "Every eNB 3GPP-style name that cannot be checked is renamed to ns3.*"
            - "Or you grant a named exception per name"

  - type: section
    title: "Q4 / P7: the size of the serial number on each label (recommended: 12 bits)"
    blocks:
      - type: rich-text
        text: |
          The question. P7 gives the EN-DC bearer a real NR PDCP header (37.340 §4.2.2 says NR PDCP is mandatory for it). The NR header carries a sequence number (SN), a counter that orders packets. 38.323 allows 12 or 18 bits. Which?

          In the analogy. The stamp has room for either a 4-digit or a 6-digit serial number. A short serial number wraps around to 0 sooner; a long one makes each stamp slightly bigger.

          In the system. At 12 bits the SN wraps every 4,096 packets (about every 2 s here) and the header is 2 bytes. At 18 bits it wraps every 262,144 packets (about every 131 s, which our live runs never reach) and the header is 3 bytes. Both are legal for a data bearer (38.323 Table 6.3.2-1, 38.331 PDCP-Config).
      - type: callout
        tone: info
        title: A correction kongming made
        text: "The researcher said only 18 bits would make the NR header look different from the old LTE header on the wire. That is wrong: LTE also has an 18-bit format with the same bytes (36.323 §6.2.11). No SN width proves 'this is NR' from the bytes alone. Kongming first still recommended 18 bits for other reasons. Codex disagreed, and after checking the code kongming changed to 12 bits (next panel)."
      - type: comparison
        left:
          label: "12 bits (recommended by both)"
          items:
            - "Enough for this traffic rate (one packet every 500 µs, scenario-zero.cc:691)"
            - "No widening of 16-bit SN fields, the shared PDCP status, or the X2 SN Status Transfer (16-bit fields, 4,096-bit bitmap)"
            - "Wraps about every 2 s, so the separate wrap-bug fix is exercised in every live run"
            - "Byte-identical to today's header, so P7 is proved by code-level checks, not by a wire difference"
        right:
          label: "18 bits"
          items:
            - "The usual eMBB setting (kongming's belief, not verified)"
            - "Every packet grows by 1 byte, so P7 shows in the checkpoint-3 diff and a missed code path fails loudly"
            - "Never wraps in a live run, so the wrap fix is never exercised live"
            - "Wider SN types through ns-3, the PDCP status and X2"
      - type: callout
        tone: warning
        title: When 18 bits would be the right answer
        text: "Choose 18 bits if you read AC16's 'the traces show an NR PDCP header' as requiring a visible wire difference between checkpoint 2 and checkpoint 3. At 12 bits, that AC16 trace check also passes on today's code, so it would be recorded openly as a format check, not as proof of the fix. The proof then comes from three checks: (a) a lint that fails if any EN-DC code path still uses the LTE header class, with the audit line printing the class; (b) P7's runs must match the wrap-fix commit's runs byte for byte; (c) the wrap test fails on today's code and passes after the fix."
      - type: accordion
        title: "Background: the existing wrap bug"
        items:
          - title: What is the SN-wrap bug?
            text: |
              ns-3 keeps some packet buffers in a map keyed by the raw SN (`lte-rlc-am.h:208`, filled at `lte-rlc-am.cc:1808`), so after a wrap it sorts 0, 1 before 4094, 4095. Two handover checks compare `SN >= SN_1 - 2` (`lte-enb-rrc.cc:1105`, `lte-ue-rrc.cc:1774`), which goes wrong when SN_1 is 0 or 1. Packets just before the wrap are silently left out. It does not crash. Both advisors recommend fixing it in its own commit right before P7: at 12 bits it fires live, and a separate commit lets P11 tell its effect apart from P7's.
          - title: "Your follow-up: the proposed wrap fix, step by step"
            text: |
              Where it matters. Both bugs sit in the code that runs when a UE changes cell. At that moment the old cell hands its unsent and unacknowledged packets to the new cell ("forwarding"), so no data is lost. The SN wrap matters only if the packets being handed over straddle the wrap, for example SNs 4094, 4095, 0, 1. Today's header is already 12-bit, so this can happen in today's runs too, about once every 2 s of traffic per UE.

              Part 1: keep the forwarded packets in sending order. `CreateRlcSduBuffer()` (`lte-rlc-am.cc:1798-1810`) copies the packets into a `std::map` keyed by the raw SN, and the forwarding code walks that map from smallest key to largest (`lte-enb-rrc.cc:1058-1069`). For 4094, 4095, 0, 1 the map gives 0, 1, 4094, 4095, so the new cell receives the newest packets first. The fix orders by distance from the oldest packet instead: key = (SN − oldest SN) mod 4,096. Then 4094 → 0, 4095 → 1, 0 → 2, 1 → 3, and the order is right. Keeping the list in the order the RLC already holds it is an equivalent fix.

              Part 2: find the right "previous" packets. The code also adds the up to 2 packets just before the first forwarded one (SN_1). It tests `SN >= SN_1 - 2 && SN <= SN_1` (`lte-enb-rrc.cc:1105`; the UE side has the same test at `lte-ue-rrc.cc:1774`). SN_1 − 2 is computed as a signed number, so when SN_1 is 1 the lower bound is −1, and 4095 (the packet just before 0) is never selected. When SN_1 is 0, the bound is −2, and 4094 and 4095 are both missed. The fix uses modular distance: select SN if (SN_1 − SN) mod 4,096 is 0, 1 or 2. For SN_1 = 1 this picks 4095, 0 and 1, as intended.

              How it is proved. A new ns-3 unit test (check c) builds exactly these cases: a buffer straddling the wrap, and SN_1 equal to 0 and 1. It must fail on today's code (proving the test can see the bug) and pass after the fix. Live runs also exercise the fixed code, because at 12 bits the SN wraps every ~2 s. The fix gets its own commit and ledger row, between P6 and P7.
          - title: "Your follow-up: why 12 bits rather than 18, in more detail"
            text: |
              1. The spec does not decide it. 38.323 Table 6.3.2-1 and 38.331 PDCP-Config allow 12 or 18 bits for a data bearer; the operator chooses. So the choice is about what works best here.

              2. 12 bits is enough here. The reordering window is half the SN space: 2,048 packets at 12 bits. At one packet every 500 µs that is about 1 s of traffic, while the X2 delay is 1 ms and RLC retransmission recovery is far shorter than 1 s. Nothing in these runs comes close to needing 1 s of packets in flight.

              3. 18 bits would ripple through shared LTE code. Today the SN is stored as a 16-bit number everywhere: in the master and UE PDCP (`mc-enb-pdcp.h:226-235`, `mc-ue-pdcp.h:195-201`), in the PDCP status shared with plain LTE (`lte-pdcp.h:103-104`), and in the X2 "SN Status Transfer" message used at handover, which carries 16-bit SNs and a 4,096-bit receive bitmap (`epc-x2-header.cc:1810-1823`). An 18-bit SN does not fit in 16 bits, so every one of these must widen; a missed one silently cuts the SN. At 12 bits none of them changes, and P7 becomes a header-class swap.

              4. The bytes cannot prove "NR" at either width. The NR 12-bit header has the same bytes as the LTE 12-bit header, and the NR 18-bit header has the same bytes as the LTE 18-bit header (36.323 §6.2.11). So 18 bits would show that something changed, not that it is NR. The NR proof must come from code-level checks either way.

              5. 12 bits keeps the wrap fix honest. At 18 bits the SN wraps only once per ~131 s of traffic, which kongming found our live runs never reach, so the fixed code would never run live. At 12 bits it runs every ~2 s.

              The case for 18 bits. It is the usual setting for EN-DC data bearers in real networks (kongming's belief, not checked against a source). Every packet grows by one byte, so P7 is visible in the checkpoint-3 diff, and any code path that still writes the old header would fail loudly instead of silently. Choose it if you want P7 to show on the wire.
          - title: "A trap Codex found: the packet tag that disappears"
            text: |
              The draft planned to mark each packet with a tag saying "NR header" and to stop with a fatal error if the tag was missing. But during a handover the eNB strips all tags (`RemoveAllPacketTags()`, `lte-enb-rrc.cc:1190`) before it forwards the packet (`:1219`). The draft's design would therefore crash on a repeated SN change. The fix: take the header type from the bearer itself, not from a tag.

  - type: section
    title: "Two lint follow-ups from Q1: which 28.552 version, and sub-counters in names (advisors answered 19:59 and 20:09)"
    blocks:
      - type: rich-text
        text: |
          The questions. 1) Which 28.552 version should the strict lint judge against? Under V17.17.0, RRU.PrbTotDl/Ul and the TB error name are real NR names; V20.2.0 calls them RRU.PrbDl/Ul and TB.ErrTotNbrDl. 2) KPM v03.00 §8.3.9 (p.30) says sub-counters belong in Measurement Labels, not in the name, so '.5QI', '.Qos' and '.1' inside a name are questionable.

          Short answer. Both advisors agree: judge against V20.2.0 only, adopt your successor rule, and let the lint flag sub-counter suffixes without adding label support in P6. Both also found that the values behind the old names are wrong, so in practice the successor rule renames nothing in P6, and about 30 of the 38 names end up as ns3.*.
      - type: table
        title: Question 1, the 28.552 version
        columns: [ Point, What the advisors found ]
        rows:
          - [ "Which version", "V20.2.0 only, pinned by exact version (not 'whatever is newest in Zotero'). KPM v03.00 §2.1 (p.4) cites 28.552 without a version and says the latest version applies, so KPM does not pin Release 17. Accepting both V17 and V20 names would be a compatibility mode, which the 'fix to spec, no legacy modes' rule forbids. Each registry row also records whether V17.17.0's text is identical." ]
          - [ "Is RRU.PrbDl really the old RRU.PrbTotDl?", "Yes. Same clause (§5.1.1.2.1), same formula, integer 0–100 %, object NRCellDU (V17.17.0 pp.33–34; V20.2.0 pp.44–45). V20.2.0 only adds optional breakdowns. The rename came in CR 0466 (V18.5.0); the TB typo was fixed in CR 0396 (V18.2.0)." ]
          - [ "Why the successor rule renames nothing in P6", "A successor name needs a value that matches it. RRU.PrbTotUl is a constant 0 marked TODO (mmwave-enb-net-device.cc:1376). RRU.PrbTotDl divides by all 14 symbols, control symbols included, so a full cell reads at most ~86 %. TB.ErrTotalNbrDl.1 counts every retransmission, not failed receptions (mmwave-phy-trace.cc:250). All three become ns3.*." ]
          - [ "Who reads these names", "kpimon stores any name by position. The TS xApp reads only the ueId tag. Only the NIST AD-cell xApp reads RRU.PrbTot*, and no gate deploys it." ]
          - [ "Alternative", "Judge against V17.17.0. Keeps RRU.PrbTot* valid for AD-cell, but contradicts KPM §2.1, and P9's bare DRB.PdcpSduVolumeX2DL exists only in V20.2.0 (V17.17.0 has only the _Filter form)." ]
      - type: table
        title: Question 2, sub-counters in names
        columns: [ Point, What the advisors found ]
        rows:
          - [ "What KPM says", "§8.3.9 (p.30) puts sub-counters in Measurement Labels (§8.3.11, pp.30–32: 5QI, QCI, MIMO layer, bins). There is no modulation label, so .Qpsk/.16Qam/.64Qam may stay in the name. KPM's 'Sum' label means cumulative since start, not a total." ]
          - [ "_Filter", "Legitimate in KPM (§7.9.1 lists _Filter names; §8.3.11 ties some labels to them), but the name type PrintableString has no underscore. Record today's reading as an interpretation: a bare name with noLabel means the unfiltered total." ]
          - [ "Label support today", "None end to end. The agent sends noLabel (kpm-indication-message.cpp:141, :192) and ignores requested labels; kpimon subscribes with noLabel and stores by name, so two rows with the same name and different labels would collide." ]
          - [ "Proposed rule", "The lint fails a suffix in a 3GPP name whenever KPM has a label for it. The row may use the bare name only if the clause defines a total and the value is that total; otherwise ns3.*. ns3.* names must not reuse 3GPP names (so ns3.du.QosFlow.PdcpPduVolumeDL fails). P6 encodes no labels, so indication bytes stay identical." ]
          - [ "Effect", "One name changes this way: gNB cell TB.TotNbrDl.1 becomes TB.TotNbrDl (single antenna, so the total is the only layer). For the others, dropping the suffix would be dishonest (no total form, a constant 0, invented names, bins that are the measurement itself), and they are renamed for those reasons anyway." ]
          - [ "Alternative", "Real label support: a separate agent + kpimon feature commit, one more rebuild/reinstall/M5–M7 cycle (~1 h, 3–5 GiB) and a second Influx rename. No surviving row needs it." ]
      - type: callout
        tone: warning
        title: More value defects the strict lint will catch
        text: "The PRB count is hard-coded at 139 (mmwave-enb-net-device.cc:1371-1372) while the cell has 28 RBs and X2 advertises 24, so RRU.PrbAvailDl/Ul and RRU.PrbUsedDl are wrong. The eNB DRB.PdcpSduDelayDl is in 0.1 ms, not ms (lte-enb-net-device.cc:1162). The eNB DRB.PdcpSduBitRateDl is PDU bytes per second although its comment says kbps (:1167). Codex adds: the current lint checks only structure; it passes all 118 rows with zero findings, so it is not yet AC16 validation, and the ad-cell xApp's patch reads the old PRB names."
      - type: key-value
        title: Effect on P6
        items:
          - { key: Order, value: "Unchanged." }
          - { key: VM budget, value: "Unchanged: all renames are one map change, so one agent rebuild, one kpimon reinstall and M5–M7." }
          - { key: Registry time, value: "About 2–3 h instead of 1–2 h, because each row needs a value check against its clause." }
      - type: callout
        tone: info
        title: "Questions as first put to you (L1 and L3 now ruled; L2, L4, L5 explained in the next section)"
        text: "1) Rule Q1 (V20.2.0 only, successor rule) and Q2 (lint flags label-expressible suffixes; no label support in P6). 2) Should the PRB source fix (real RB count, denominator, UL usage) go inside M10, which would let that family return to 3GPP names, or be recorded as a follow-up outside M10? Kongming recommends a follow-up. 3) Does the P6 rule include the per-UE check against KPM §7.9? If yes, the gNB UE-list TB rows also become ns3.*, because §7.9 lists no TB type. 4) The lint needs a stated type rule, because some kept names are sent as REAL where 3GPP specifies an integer. (The values of RRC.ConnMean, DRB.MeanActiveUeDl and DRB.UEThpDl are still unchecked; the registry must check them.)"

  - type: section
    title: "Three lint rulings (all ruled 21:37: L2 flag, L4 yes, L5 3GPP type)"
    blocks:
      - type: rich-text
        text: |
          What these three are about. P6 builds a registry: one entry per metric-map row saying which spec clause the name comes from, what the value really counts, and whether the two match. The strict lint then reads that registry. You already fixed the main rule (a failing 3GPP name becomes ns3.*) and the version (28.552 V20.2.0). These three rulings fill in the last details of what "matches the clause" means. None of them changes P6's commit order or VM budget; all renames land in the same single map change.

          In the analogy. The logbook column names come from the rulebook. L2 is about columns whose name carries an extra tag such as "for QoS class 9". L4 is about whether a column the rulebook defines for a whole office may also be kept per house. L5 is about whether a column must be written as whole numbers or may use decimals.
      - type: accordion
        title: "L2: sub-counters written into the name (recommended: the lint flags them; no label support in P6)"
        items:
          - title: What is a sub-counter, and what is a Measurement Label?
            text: |
              Many 3GPP measurements can be split into parts. 28.552 writes the part into the name: `DRB.UEThpDl.QOS` means "UE throughput, one counter per QoS class", and `TB.TotNbrDl.X` means "TB count, one counter per MIMO layer X". Each part is a sub-counter.

              KPM sends names over E2 differently. Its Measurement Name must be the plain 3GPP name, and the part goes in a separate field next to it, the Measurement Label (KPM v03.00 §8.3.9, p.30: "The subcounters are represented by the Measurement Labels defined in 8.3.11"). §8.3.11 (pp.30–32) lists the labels KPM has: PLMN, slice, 5QI, QFI, QCI, MU-MIMO layer, distribution bins X/Y/Z, a few _Filter bounds, and "noLabel", meaning "without any subcounter". There is no label for modulation (QPSK, 16QAM, 64QAM).

              So `TB.TotNbrDl.1` in our map is a KPM mistake in form: KPM wants name `TB.TotNbrDl` with label "MU-MIMO layer = 1", or name `TB.TotNbrDl` with noLabel if the value is the total over all layers.
          - title: Which names in our map have this problem?
            text: |
              `TB.TotNbrDl.1` and `TB.ErrTotalNbrDl.1` (".1" = layer 1), `DRB.EstabSucc.5QI` and `DRB.RelActNbr.5QI` (the literal text ".5QI", not even a real 5QI number), `DRB.BufferSize.Qos` and `DRB.PdcpPduNbrDl.Qos`, the bins `CARR.PDSCHMCSDist.Bin1–6` and `L1M.RS-SINR.Bin*`, and the modulation names `TB.TotNbrDlInitial.Qpsk/16Qam/64Qam`.
          - title: Why not just add real label support?
            text: |
              Neither side can carry labels today. The agent sends noLabel for every row (`kpm-indication-message.cpp:48-53, :144-150, :196-198`) and ignores labels a subscription asks for (`kpm-subscription-admission.cpp:115-132`). kpimon subscribes with noLabel and stores values by name in Influx, so two rows with the same name and different labels would overwrite each other. Real labels would need a map-schema change, about 50 lines in the agent encoder, a kpimon Go/C patch, a second Influx rename and a new golden file: its own commit with one more rebuild, kpimon reinstall and M5–M7 (about 1 h and 3–5 GiB). And after the value checks, no row that keeps a 3GPP name needs a label.
          - title: What the recommended rule does, row by row
            text: |
              The lint parses each 3GPP name and fails a suffix whenever KPM has a label for that kind of sub-counter. The row may then drop the suffix and use the bare name with noLabel only if (a) the clause defines a total, and (b) the value really is that total. Otherwise the row becomes ns3.*. Modulation suffixes stay in the name, because KPM has no label for them and 28.552 lists those exact names. Vendor ns3.* names may not reuse a 3GPP name (so today's `ns3.du.QosFlow.PdcpPduVolumeDL` is renamed too).

              Result: one row becomes a cleaner 3GPP name. gNB cell `TB.TotNbrDl.1` becomes `TB.TotNbrDl`: the value counts every TB (`mmwave-phy-trace.cc:248`) and the scenario has one antenna (`scenario-zero.cc:525-527`), so the total over layers equals layer 1. Every other suffixed row fails for a deeper reason anyway (no total form exists in 28.552, a constant 0, an invented base name, bins with the wrong form, or modulation counts that include retransmissions) and becomes ns3.*.
      - type: comparison
        left:
          label: "L2 recommended: flag in the lint, no labels in P6"
          items:
            - "Lint gets a small suffix-grammar table"
            - "One row renamed to TB.TotNbrDl; the rest are ns3.* for other reasons"
            - "Indication bytes and the KPM golden stay identical"
            - "Limit: a future 3GPP name with no total form stays ns3.* until labels exist"
        right:
          label: "Alternative: real label support now"
          items:
            - "Closest to KPM §8.3.9"
            - "Own agent + kpimon commit, ~1 h and 3–5 GiB, second Influx rename"
            - "No surviving row needs it"
            - "Could be a follow-up outside M10, like the PRB fix"
      - type: accordion
        title: "L4: may a cell measurement also be sent per UE? (recommended: yes, register the KPM §7.9 check)"
        items:
          - title: What is the question?
            text: |
              Our agent sends two lists: a cell list (one value per cell) and a UE list (one value per UE). 3GPP defines almost every measurement per cell. KPM v03.00 §7.9 (pp.13–14) says how a 3GPP cell measurement may be turned into a per-UE one: "the formulas specified in 3GPP are used with restriction to the individual UE". But it does this only for the types in its table: throughput, delay, data volume, in-session activity time, PDCP drop rate, IP latency, radio resource utilization, RRC connections / PDU sessions / DRBs / QoS flows, mobility management, CQI and MCS, and released calls. Transport-block (TB) counts are not in the table.
          - title: Which rows does it affect?
            text: |
              Only the UE-list rows that would otherwise keep a 3GPP name: gNB UE `TB.TotNbrDl.1` (would become `TB.TotNbrDl`) and gNB UE `TB.TotNbrDlInitial`. With the §7.9 check registered, both become ns3.* names (for example `ns3.du.tbTotNbrDl`), because KPM gives no rule for a per-UE TB count. `DRB.UEThpDl` on the UE list is fine: throughput is the first row of the table. The other UE rows are already ns3.* for other reasons.
          - title: Why recommend the check?
            text: |
              It is the same principle as the rest of P6: keep a 3GPP name only where a spec says exactly what it means. Without the check, the per-UE TB count would carry a 3GPP name that no spec defines per UE. It costs nothing extra: the two renames ride in the same map change. Kongming's confidence is medium, because §7.9 is a table of types rather than an explicit "nothing else is allowed" rule. The alternative reading is that "restrict the 3GPP formula to one UE" works for any count, so per-UE TB counts could keep `TB.TotNbrDl` and `TB.TotNbrDlInitial`.
      - type: comparison
        left:
          label: "L4 recommended: register the §7.9 check"
          items:
            - "Per-UE rows keep a 3GPP name only if §7.9 lists their type"
            - "2 rows renamed: gNB UE TB.TotNbrDl(.1) and TB.TotNbrDlInitial"
            - "No extra cost"
        right:
          label: "Alternative: no per-UE check"
          items:
            - "Per-UE TB rows keep 3GPP names by analogy"
            - "Relies on a reading §7.9 does not state"
      - type: accordion
        title: "L5: data type of a kept 3GPP name (recommended: must match the 3GPP type, with KPM §7.9.1's overrides)"
        items:
          - title: What is the question?
            text: |
              Every 3GPP measurement says in item (d) whether its value is an integer or a real number. KPM sends either an integer or a REAL value, and §7.9.1 (p.14) changes a few (the PDCP volumes become INTEGER in kbit instead of Mbit). Our map has its own rule (`metric-map.v1.json` doc): "INTEGER only for values guaranteed in 0..2^31-1 (kpimon casts to int32); everything else REAL". That rule protects kpimon from overflow but ignores the spec. The lint therefore needs a stated rule for kept 3GPP names.
          - title: Is anything wrong today?
            text: |
              I checked every row that will keep a 3GPP name against 28.552 V20.2.0. All already match: `TB.TotNbrDl` and `TB.TotNbrDlInitial` are integers (§5.1.1.7.3 d, §5.1.1.7.1 d) and INTEGER in the map; `RRC.ConnMean` and `DRB.MeanActiveUeDl` are "a single integer value" and INTEGER; `DRB.UEThpDl` is "a real value … in kbit per second" (§5.1.1.3.1 d) and REAL; the PDCP volume and X2 rows are INTEGER kbit per KPM §7.9.1. One correction: kongming gave `DRB.UEThpDl` as an example of a mismatch, but 28.552 defines it as real, so it matches. So L5 changes nothing in P6; it is a rule that keeps future rows honest.
          - title: What the recommended rule says
            text: |
              A row with a 3GPP name must use that clause's data type, or KPM §7.9.1's replacement where one exists. If a spec-integer value could exceed kpimon's int32 range, the row fails rather than silently switching to REAL. Per-period counts in 100 ms are far below that range, so no current row is affected. ns3.* rows keep the map's existing overflow rule.
      - type: comparison
        left:
          label: "L5 recommended: 3GPP type (KPM overrides)"
          items:
            - "Kept names carry the type their clause defines"
            - "No current row changes"
            - "Overflow risk makes the row fail, not change type"
        right:
          label: "Alternative: keep the map's overflow rule for all rows"
          items:
            - "Simpler"
            - "A future 3GPP row could carry a REAL where 3GPP says integer, and the lint would not notice"

  - type: section
    title: What kongming and Codex recommend
    blocks:
      - type: rich-text
        text: |
          Two advisors answered separately. Kongming (Opus 5.5, xhigh effort) read the spec PDFs in Zotero and the code. Codex (read-only, high effort) read only the code and took the spec citations as given. Kongming then checked every new code claim in Codex's answer: all 11 held, with small line-number drift.
      - type: table
        title: Final positions
        columns: [ "#", Kongming first, Codex, Kongming after cross-check, Who moved ]
        rows:
          - [ UB, Fix (Amendment 4), Fix (Amendment 4), "Fix; tests at map sizes 1, 2, 8, 9, 10 and ties", "Nobody; Codex widened the tests" ]
          - [ Q1, Rename to ns3.*, Rename to ns3.*, "Rename; the registry also records which node owns each value and what event it counts", "Nobody; Codex added fields" ]
          - [ Q2, Option A, Option A, "Option A; the volume check judges each cell separately", "Nobody; Codex found a loophole" ]
          - [ Q3, "32.425, soft fallback", "32.425, strict fallback", "32.425, strict fallback", "Kongming" ]
          - [ Q4, "18 bits, wrap fix inside P7", "12 bits, wrap fix as its own commit", "12 bits, wrap fix as its own commit", "Kongming" ]
      - type: accordion
        title: What each advisor added
        items:
          - title: "UB: an off-by-one at eight neighbours (Codex)"
            text: |
              With exactly 8 cells in the map, ns-3 says 8 neighbours although only 7 exist (`mmwave-enb-net-device.cc:993-997`, padding at `:1025`). Kongming confirmed it but noted it affects only the CSV log, which no gate turns on; the missing-neighbour bug is the one that reaches the RIC. Both want the fix tested at map sizes 1, 2, 8, 9 and 10 and with equal-strength ties.
          - title: "Q1 and Q2 are linked (Codex; kongming proposed the mechanism)"
            text: |
              Map rows `:56-57` carry volume the main office stamped, credited to the en-gNB (`mmwave-enb-net-device.cc:672-693`). That is P9's defect. So P6's honest lint cannot pass the whole map before P9 is done. Kongming's fix: P6's lint lists those two rows as named expected failures marked "pending P9", without passing or renaming them. P9 and P11 then require that list to be empty.
          - title: "Q2: the volume check could be fooled (Codex)"
            text: |
              The PDCP volume judge pools cells that share a UE and checks only their sum (`check-pdcp-volume-totals.py:160-192`). Volume moved from one cell to the other would pass. It should judge each cell separately, with a negative test that swaps the cells but keeps the sum. Kongming also defined what counts as an X2 send: every PDCP packet the MN sends over X2 to cell c, including packets re-sent after an LTE-to-NR switch (`lte-enb-rrc.cc:1227-1239`); forwarding between two en-gNBs is excluded and disclosed.
          - title: "Q4: why kongming changed to 12 bits"
            text: |
              Three reasons. 18 bits means widening 16-bit sequence numbers through ns-3, the shared PDCP status and the X2 SN Status Transfer. At 12 bits the wrap fix runs in every live test, so it is really exercised. And the wire bytes cannot prove NR at either width, so the "visible in the diff" benefit of 18 bits proves less than it seemed.
          - title: Where each advisor was wrong
            text: |
              Kongming: the soft Q3 fallback, no owner field in the P6 registry, the tag design untested, the cost of 18 bits underweighted, the LTE-to-NR re-send path missed, and UB tests too narrow.

              Codex: it overstated the 8-neighbour miscount (CSV only), argued the separate wrap commit from bisection when its bigger value is enabling the byte-identity check, did not say that AC16's trace clause passes on today's code, and gave no mechanism for the P6/P9 link or for "first send".

  - type: section
