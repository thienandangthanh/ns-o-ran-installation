    blocks:
      - type: table
        columns: [ Item, Rule, Due ]
        rows:
          - [ "P7 check (b) baseline", "Run check (b) at checkpoint 2 first. Where cp2 loses no packet, P7 must lose none. Where cp2 loses some, judge byte equality, no duplicates and in-order delivery, and record both loss counts.", Before P7 code ]
          - [ SN-wrap fix, "Its own commit between P6 and P7 (inside P7's commit only if you choose 18 bits).", Before P7 code ]
          - [ "'Pending P9' marker", "P6's lint lists rows :56-57 as named expected failures; P9 and P11 require the list to be empty.", Before P6 code ]
          - [ Per-cell volume judge, "The PDCP volume check judges each cell, with a swapped-cells negative fixture; X2 send counting as defined above.", Before P9 code ]
          - [ Header type from the bearer, "The NR/LTE header choice comes from the bearer, not a packet tag, and the forwarding path is tested.", Before P7 code ]
          - [ "c under real RRC", "The handover offset c must be 3.0 ms (three 1 ms X2 hops). Any other value, or an applied control with no handover start, is a Stop. The probe runs on the candidate commit itself.", Before the probe ]
          - [ Row 158, "Additive amendment to row 139 (hex-letter cell IDs in the public fixture).", Before the TS serving-cell commit ]
          - [ Revert plan, "Three VM revert cycles instead of two: between P9 and P15, and between the kpimon node tag and the TS serving cell. A fourth, before P9, only if /home has less than 33 GiB free after P7's gates. P10 wall time about 15–18 h.", Before P6 ]

  - type: section
    title: Glossary
    blocks:
      - type: key-value
        items:
          - { key: "EN-DC", value: "E-UTRA–NR Dual Connectivity: the phone is connected to an LTE eNB and a 5G en-gNB at once." }
          - { key: "MN / SN", value: "Master node (the LTE eNB, which controls the connection) and secondary node (the en-gNB, which adds capacity)." }
          - { key: "Split bearer", value: "One data stream whose packets are numbered at the MN and then sent over either radio." }
          - { key: "PDCP", value: "Packet Data Convergence Protocol: the layer that numbers, ciphers and reorders packets." }
          - { key: "RLC / MAC", value: "Radio Link Control and Medium Access Control: the lower layers that queue, retransmit and schedule packets on the radio." }
          - { key: "X2-U", value: "The user-plane link between the eNB and the en-gNB." }
          - { key: "KPM", value: "Key Performance Measurement: the O-RAN service model through which nodes report counters to the RIC." }
          - { key: "28.552 / 32.425", value: "The 3GPP rulebooks that define performance measurement names for 5G and LTE nodes." }
          - { key: "Split gNB", value: "A 5G base station divided into a central unit (CU) and distributed units (DU). Ours is not split." }
          - { key: "SN", value: "Sequence number: the counter PDCP writes into each packet header." }
          - { key: "UB", value: "Undefined behaviour: C++ code whose result the language does not define." }
          - { key: "T3 ruling", value: "Your approval to change a protected file that decides whether a test passes." }
          - { key: "Amendment", value: "A user-approved change to the locked M10 outcome contract." }
          - { key: "Checkpoint 3 (cp3)", value: "The tagged set of new references after the T-C fixes, made in P11." }

