[project]
name = "ns-o-ran-installation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
    "rich>=14.3.1",
    "stable-baselines3>=2.4.1",
    "tensorboard>=2.14.0",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".claude/",
    ".opencode/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
